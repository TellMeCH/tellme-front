name = "tellme-landing"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets for SSR app
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Production Environment (www.tell-me.ch)
[env.prod]
name = "tellme-landing-prod"
routes = [
  { pattern = "www.tell-me.ch", custom_domain = true }
]
vars = { ENVIRONMENT = "prod" }

# Enable Workers Logs with optional sampling rate
[env.prod.observability]
enabled = true
head_sampling_rate = 1  # Logs 100% of requests; adjust as needed

# KV Cache
[[env.prod.kv_namespaces]]
binding = "kv"
id = "795f88bdfeba4c96a804c9fe9aa180bf"

