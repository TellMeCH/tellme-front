name: Deployment

on:
  pull_request:
    branches:
      - main
      - staging
    types: [closed]

env:
  TELLME_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

jobs:
  deploy:
    name: Deploy to Cloudflare
    environment:
      name: ${{ github.ref_name }}
    env:
      REACT_APP_FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
      REACT_APP_BACKEND_URL: ${{ secrets.BACKEND_URL }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm install --legacy-peer-deps
        env:
          NODE_ENV: development

      - name: Build
        run: npx nx run web:build:worker

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy ./apps/web/.open-next/worker.js --env=${{ env.TELLME_ENV }}
