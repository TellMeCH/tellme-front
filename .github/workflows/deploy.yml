name: Deployment

on:
  pull_request:
    branches:
      - main
      - staging
    types: [closed]

env:
  TELLME_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

jobs:
  deploy_web:
    name: Deploy Frontend to Cloudflare
    environment:
      name: ${{ github.ref_name }}
    env:
      NEXT_PUBLIC_FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
      NEXT_PUBLIC_BACKEND_URL: ${{ secrets.BACKEND_URL }}
      NEXT_PUBLIC_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_API_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install
        run: npm install --legacy-peer-deps
        env:
          NODE_ENV: development

      - name: Build
        run: npx nx run web:build:worker

      - name: Find
        run: find . -name "worker.js"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.54.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env=${{ env.TELLME_ENV }}
          workingDirectory: apps/web

  deploy_landing:
    if: ${{ github.ref_name == 'main' }}
    name: Deploy Landing Page to Cloudflare
    environment:
      name: ${{ github.ref_name }}
    env:
      NEXT_PUBLIC_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install
        run: npm install --legacy-peer-deps
        env:
          NODE_ENV: development

      - name: Build
        run: npx nx run landing:build:worker

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.54.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env=${{ env.TELLME_ENV }}
          workingDirectory: apps/landing

  e2e_testing:
    name: End-to-end Testing of Deployed Application
    environment:
      name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: deploy_web
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'read'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: access_token
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.CICD_SERVICE_ACCOUNT_JSON_KEY }}
        service_account: ${{ secrets.CICD_SERVICE_ACCOUNT }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install Dependencies
      run: |
        cd tests_e2e
        uv sync

    - name: Ensure browsers are installed
      run: |
        cd tests_e2e
        uv run python -m playwright install --with-deps

    - name: Run End-to-end Testing Routine
      env:
        TELLME_ENV: ${{ env.TELLME_ENV }}
        CLOUD_RUN_HOST: ${{ secrets.BACKEND_URL }}
        FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
      run: |
        cd tests_e2e
        uv run pytest --tracing=retain-on-failure --output ./test-results/
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-traces
        path: test-results/
