name = "tellme-front"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets for SSR app
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Staging Environment (test.tell-me.ch)
[env.staging]
name = "tellme-front-staging"
routes = ["https://test.tell-me.ch/*"]
vars = { ENVIRONMENT = "staging" }

# KV Cache for Staging
[[env.staging.kv_namespaces]]
binding = "kv"
id = "e4245fa569aa4c4f958ebdeb5a5988e6"

# Production Environment (app.tell-me.ch)
[env.prod]
name = "tellme-front-prod"
routes = ["https://app.tell-me.ch/*"]
vars = { ENVIRONMENT = "prod" }

# KV Cache for Staging
[[env.prod.kv_namespaces]]
binding = "kv"
id = "8203e5196bfa4ea4a19a1138fab4226b"
