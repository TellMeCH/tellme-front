name = "tellme-front"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets for SSR app
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Staging Environment (test.tell-me.ch)
[env.staging]
name = "tellme-front-staging"
routes = ["https://test.tell-me.ch/*"]
vars = { ENVIRONMENT = "staging" }

# Production Environment (app.tell-me.ch)
[env.main]
name = "tellme-front-main"
routes = ["https://app.tell-me.ch/*"]
vars = { ENVIRONMENT = "main" }

# KV Cache
[[kv_namespaces]]
binding = "tellme_front_cache"
id = "6fe27b120d354d5dbba47488fdbc3d08"
