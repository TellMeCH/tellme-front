name = "tellme-landing"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets for SSR app
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Production Environment (test.tell-me.ch)
[env.prod]
name = "tellme-landing-prod"
routes = ["https://www.tell-me.ch/*"]
vars = { ENVIRONMENT = "prod" }

# KV Cache for Staging
[[env.prod.kv_namespaces]]
binding = "kv"
id = "795f88bdfeba4c96a804c9fe9aa180bf"

